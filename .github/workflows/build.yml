name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Setup Android SDK
      uses: android-actions/setup-android@v2
    - name: Build APK
      run: |
        chmod +x gradlew
        ./gradlew assembleRelease
    - name: Sign APK (debug key for demo)
      run: |
        cd app/build/outputs/apk/release
        keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -dname "CN=Debug, OU=Debug, O=Debug, L=Debug, ST=Debug, C=US" -validity 10000
        jarsigner -verbose -sigalg SHA1withRSA -digestalg SHA1 -keystore debug.keystore -storepass android app-release-unsigned.apk androiddebugkey
        $ANDROID_HOME/build-tools/30.0.3/zipalign -v -p 4 app-release-unsigned.apk app-release.apk
    - name: Upload APK
      uses: actions/upload-artifact@v3
      with:
        name: RiqelCyberTool-release
        path: app/build/outputs/apk/release/app-release.apk
